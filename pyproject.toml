[project]
name = "skazki-bot"
version = "0.1.0"
description = "Telegram-бот: персональные сказки для детей на русском языке"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "anthropic>=2.3,<3",
    "sqlalchemy[asyncio]>=2.1",
    "aiosqlite>=0.22",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
    "pyyaml>=6.0.3",  # first release with Python 3.14 wheels
]

[project.optional-dependencies]
redis = ["redis>=7.4,<8"]  # aiogram's RedisStorage is tested against redis-py < 8

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML",
    "httpx2>=2.16",  # HTTP-слой SDK Anthropic; нужен для подставного транспорта в тестах адаптера
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skazki_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["patch_*.py", "patches", ".patch-backups"]  # AI-workflow artifacts, not project code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях — это нормально
    "E501",  # длину строк правит `ruff format`; длинные русские тексты/промпты оставляем целыми
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC109"]  # сигнатуру make_request диктует aiogram

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["skazki_bot"]
