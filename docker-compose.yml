# Продакшен-подобный стенд: бот + PostgreSQL + Redis.
#   docker compose up --build -d
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://skazki:skazki@db:5432/skazki
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Для RUN_MODE=webhook откройте порт и поставьте перед ботом HTTPS-прокси (Caddy/Nginx/Cloudflare):
    # ports: ["8080:8080"]

  db:
    # PostgreSQL 18+ images keep data in /var/lib/postgresql/<major>/docker, so the volume is mounted one level up.
    # The volume is named pgdata18 on purpose: an old pgdata (PG 17) volume stays untouched; move data with
    # pg_dump / pg_restore (a major version cannot reuse another major's data directory).
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skazki
      POSTGRES_PASSWORD: skazki
      POSTGRES_DB: skazki
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skazki -d skazki"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata18:
  redisdata:
