# Compliments for the adult who reads the tales. Part of the warm-words knowledge base.
#
# Rules (enforced by tests/test_knowledge.py; details in docs/KNOWLEDGE.md):
#   * Russian, one to three short sentences, up to 280 characters.
#   * Address the reader as polite «вы» in GENDER-NEUTRAL forms (no «вы добрая/добрый»),
#     no role words (мама, папа, мать, отец): the reader may be any caring adult.
#   * Specific and honest beats superlatives. No comparisons with other people.
#   * `{child}` = the child's name in the NOMINATIVE case only, as the sentence subject,
#     with no gendered pronouns or adjectives; set `child: true` when you use it.
# Fields: id (cm01..), text, moods (any|tired|anxious|stuck|proud), times (any|morning|day|evening),
#         child, tags. Defaults: moods [any], times [any], child false.
# Items with moods other than `any` are used only when the reader asks for that mood.

- id: cm01
  text: "Вы находите время на сказку даже в длинный день. Ребёнок запомнит именно это."
  times: [evening]
- id: cm02
  text: "То, как внимательно вы подбираете слова для своего ребёнка, — настоящая работа сердца."
- id: cm03
  text: "У вас получается больше, чем вам кажется. Со стороны это видно лучше."
- id: cm04
  text: "Вы умеете замечать важное: настроение, взгляд, паузу. Это редкий и ценный дар."
- id: cm05
  text: "Ваша забота делает мир вокруг ребёнка безопаснее. Это не мелочь, а основа."
- id: cm06
  text: "Для ребёнка вы — самый нужный человек. Идеальность тут ни при чём."
- id: cm07
  text: "Каждый вечер, когда вы остаётесь рядом, ребёнок получает подарок, который не купишь."
  times: [evening]
- id: cm08
  text: "Вы продолжаете стараться, даже когда никто не аплодирует. Это и называется силой."
- id: cm09
  text: "Ваше терпение — тихая суперсила. Спасибо, что она у вас есть."
- id: cm10
  text: "Вы выбираете спокойный вечер вместо спешки, и ребёнок это чувствует."
  times: [evening]
- id: cm11
  text: "Рядом с вами ребёнок учится главному: его слышат."
- id: cm12
  text: "Вы умеете радоваться мелочам и учите этому тех, кто рядом."
- id: cm13
  text: "Не каждый вспомнит про сказку в разгар дел. Вы вспомнили."
  times: [day]
- id: cm14
  text: "Вам удаётся быть рядом и в радости, и в усталости. Это дорогого стоит."
  moods: [tired]
- id: cm15
  text: "Ваш голос для ребёнка самый уютный на свете, даже если вы читаете сонно."
  times: [evening]
- id: cm16
  text: "Вы растите не просто ребёнка, а целый маленький мир, и делаете это с любовью."
- id: cm17
  text: "У вас тёплые слова и тёплые руки. Ребёнку с вами повезло."
- id: cm18
  text: "Вы хорошо слышите, что стоит за детскими «почему». Это большой дар."
- id: cm19
  text: "Спасибо, что вы делаете мир добрее — хотя бы для одного маленького человека."
- id: cm20
  text: "Остановитесь на секунду и признайте: вы молодец. Серьёзно."
  moods: [proud]
- id: cm21
  text: "То, что вы заметили свой успех, — тоже умение. Порадуйтесь ему."
  moods: [proud]
- id: cm22
  text: "Вы столько всего уже сделали. Позвольте себе гордиться без «но»."
  moods: [proud]
- id: cm23
  text: "Вы устали не потому, что слабы, а потому, что много сделали."
  moods: [tired]
- id: cm24
  text: "Сегодня достаточно просто быть рядом. Этого уже много."
  moods: [tired]
- id: cm25
  text: "Усталость — это след заботы. Вы заслужили передышку."
  moods: [tired]
- id: cm26
  text: "Вы переживаете, потому что вам не всё равно. Это тоже сила."
  moods: [anxious]
- id: cm27
  text: "Тревога говорит громко, но это не значит, что она права. Вы справляетесь."
  moods: [anxious]
- id: cm28
  text: "То, что вы продолжаете искать выход, говорит о вас больше, чем любая неудача."
  moods: [stuck]
- id: cm29
  text: "Вы уже прошли немалый путь. Один трудный участок его не отменяет."
  moods: [stuck]
- id: cm30
  text: "С добрым утром! Вы уже начали этот день, и это хорошее начало."
  times: [morning]
- id: cm31
  text: "Утро — удобное время, чтобы сказать себе пару добрых слов. Например: «У меня получается»."
  times: [morning]
- id: cm32
  text: "Посреди дел остановитесь на миг: вы справляетесь лучше, чем думаете."
  times: [day]
- id: cm33
  text: "Вечер — время признать: день был непростым, а вы с ним справились."
  times: [evening]
- id: cm34
  text: "Спасибо вам за сегодня: за терпение, за заботу, за все маленькие дела, которых никто не заметил."
  times: [evening]
- id: cm35
  text: "У вас хороший вкус на добрые истории. Это чувствуется."
- id: cm36
  text: "Вы умеете быть рядом так, что становится спокойнее. Это редкое умение."
- id: cm37
  text: "Ваше внимание к мелочам превращает обычный день в тёплый."
- id: cm38
  text: "Вы не обязаны знать всё наперёд. Достаточно делать следующий добрый шаг."
- id: cm39
  text: "Ребёнку повезло расти там, где его слушают и берегут. Это ваша заслуга."
- id: cm40
  text: "{child} растёт рядом с человеком, который старается. Это чувствуется."
  child: true
- id: cm41
  text: "{child} засыпает спокойнее, когда рядом ваш голос."
  child: true
  times: [evening]
- id: cm42
  text: "{child} знает: рядом есть тот, кто выслушает. Это огромная опора."
  child: true
- id: cm43
  text: "{child} учится у вас доброте — не на словах, а на примере."
  child: true
- id: cm44
  text: "Сегодня {child} получает от вас главное — внимание. Лучшего подарка не найти."
  child: true
- id: cm45
  text: "{child} просыпается в мире, где любят и ждут. Спасибо, что вы его создаёте."
  child: true
  times: [morning]
- id: cm46
  text: "Даже в самый шумный день {child} чувствует: рядом надёжный человек."
  child: true
  moods: [tired]
- id: cm47
  text: "Вы сегодня уже сделали много добрых дел, даже если не посчитали их."
- id: cm48
  text: "Ваши усилия видны. Не всегда сразу, но они складываются в чувство дома."
- id: cm49
  text: "Вы заслужили похвалу: и чужую, и собственную."
  moods: [proud]
- id: cm50
  text: "Сказка на ночь — маленький ритуал, который остаётся в памяти на всю жизнь. Спасибо, что вы его создаёте."
  times: [evening]
