# Russian folk proverbs with a gentle one-line gloss (`note`) that links them to everyday parenting
# and motivation. Part of the warm-words knowledge base. Ids pr01..; `note` is required.
# Only traditional proverbs and sayings (public domain); no attributed quotations.
# The note speaks to the reader as polite «вы» in gender-neutral forms, like every cheer item.

- id: pr01
  text: "Дорогу осилит идущий."
  note: "Не нужно идти быстро — важно просто не останавливаться."
- id: pr02
  text: "Терпение и труд всё перетрут."
  note: "Маленькие ежедневные усилия складываются в большое дело."
- id: pr03
  text: "Глаза боятся, а руки делают."
  note: "Издали дело кажется страшным. Начните — и станет понятнее."
  moods: [stuck, anxious]
- id: pr04
  text: "Утро вечера мудренее."
  note: "Усталым вечером всё кажется тяжелее. Дайте мыслям выспаться."
  moods: [tired, anxious]
  times: [evening]
- id: pr05
  text: "Под лежачий камень вода не течёт."
  note: "Даже маленький шаг запускает движение."
  moods: [stuck]
  times: [morning, day]
- id: pr06
  text: "Доброе слово и кошке приятно."
  note: "Тёплые слова согревают всех — и тех, кто их говорит."
- id: pr07
  text: "Одна голова хорошо, а две лучше."
  note: "Попросить совета или помощи — это мудро."
  moods: [stuck]
- id: pr08
  text: "Всякому овощу своё время."
  note: "У каждого ребёнка и у каждого дела свой срок созревания."
  moods: [anxious]
- id: pr09
  text: "Курочка по зёрнышку клюёт, да сыта бывает."
  note: "Большое складывается из маленьких ежедневных шагов."
- id: pr10
  text: "Лучше поздно, чем никогда."
  note: "Начать можно в любой день — даже сегодня."
  moods: [stuck]
- id: pr11
  text: "Тише едешь — дальше будешь."
  note: "Медленно — не значит плохо. Берегите силы."
  moods: [tired]
- id: pr12
  text: "Не боги горшки обжигают."
  note: "Учатся все. Ошибаться можно, главное — пробовать снова."
  moods: [stuck]
- id: pr13
  text: "Семь раз отмерь, один раз отрежь."
  note: "Спокойно подумать — не потерять время, а выиграть его."
  moods: [anxious]
- id: pr14
  text: "Мал золотник, да дорог."
  note: "Маленькие дела бывают самыми важными: одна сказка, одно объятие."
- id: pr15
  text: "Где любовь да совет, там и горя нет."
  note: "Тепло и поддержка согревают дом лучше всего."
  times: [evening]
- id: pr16
  text: "Век живи — век учись."
  note: "Учиться никогда не поздно, и это про рост, а не про недостатки."
  moods: [stuck]
- id: pr17
  text: "Без труда не вытянешь и рыбку из пруда."
  note: "Усилия видны не сразу, но рано или поздно дают результат."
  moods: [stuck, tired]
- id: pr18
  text: "Мир не без добрых людей."
  note: "Если станет трудно, рядом найдётся тот, кто поможет."
- id: pr19
  text: "На ошибках учатся."
  note: "Каждая неудача оставляет опыт, а опыт делает мягче и мудрее."
  moods: [stuck]
- id: pr20
  text: "Сделал дело — гуляй смело."
  note: "Заслуженный отдых — тоже часть работы."
  moods: [proud, tired]
- id: pr21
  text: "Лиха беда начало."
  note: "Самое трудное — первые шаги. Дальше обычно проще."
  moods: [stuck]
- id: pr22
  text: "Первый блин комом."
  note: "Первая попытка редко бывает идеальной, и это нормально."
  moods: [stuck]
- id: pr23
  text: "Волков бояться — в лес не ходить."
  note: "Немного страха — спутник любой важной дороги."
  moods: [anxious]
- id: pr24
  text: "Смелость города берёт."
  note: "Решиться иногда важнее, чем всё рассчитать."
  moods: [stuck]
- id: pr25
  text: "Собака лает — ветер носит."
  note: "Чужие слова не обязаны становиться вашими."
  moods: [anxious]
- id: pr26
  text: "Не красна изба углами, а красна пирогами."
  note: "Уют создаёт не идеальный порядок, а тепло и забота."
- id: pr27
  text: "В гостях хорошо, а дома лучше."
  note: "Дом — это место, где можно выдохнуть."
  moods: [tired]
  times: [evening]
- id: pr28
  text: "Всё хорошо, что хорошо кончается."
  note: "День мог быть непростым, но тёплый вечер многое исправляет."
  times: [evening]
- id: pr29
  text: "За двумя зайцами погонишься — ни одного не поймаешь."
  note: "Одно дело за раз — и силы целее, и результат лучше."
  moods: [anxious, tired]
- id: pr30
  text: "Ласковое слово что весенний день."
  note: "Нежные слова согревают сильнее, чем кажется."
- id: pr31
  text: "Кто ищет, тот всегда найдёт."
  note: "Если продолжать искать, решение найдётся."
  moods: [stuck]
- id: pr32
  text: "Дело мастера боится."
  note: "Навык растёт с каждым разом, и вы уже на этом пути."
  moods: [stuck, proud]
- id: pr33
  text: "Не имей сто рублей, а имей сто друзей."
  note: "Люди рядом — самое надёжное богатство."
- id: pr34
  text: "Старый друг лучше новых двух."
  note: "Позвоните тому, с кем легко: такой разговор часто возвращает силы."
  moods: [tired, anxious]
- id: pr35
  text: "Что посеешь, то и пожнёшь."
  note: "Добрые слова и дела, посеянные сегодня, вырастут завтра."
- id: pr36
  text: "Один в поле не воин."
  note: "Просить о поддержке — не слабость, а общая сила."
  moods: [tired, stuck]
