# Words of encouragement: gentle, practical, never pushy. Part of the warm-words knowledge base.
# Same rules and fields as compliments.yaml (ids en01..). Not medical or psychological advice:
# no diagnoses, no "you should". Offer a small step, a pause, or a different angle.

- id: en01
  text: "Сделайте глубокий вдох. Прямо сейчас нужен один маленький шаг, а не весь путь."
  moods: [tired]
- id: en02
  text: "Отдых — не награда за дела, а часть дела. Вы вправе передохнуть."
  moods: [tired]
- id: en03
  text: "Сегодня можно сделать меньше. Мир подождёт, а тёплый чай и тихая сказка помогут выдохнуть."
  moods: [tired]
- id: en04
  text: "Если сил совсем мало, оставьте только главное. Остальное спокойно подождёт до завтра."
  moods: [tired]
- id: en05
  text: "Вы не обязаны решить всё сегодня. Выберите одно дело и начните с него."
  moods: [anxious]
- id: en06
  text: "Если мысли бегут вперёд, вернитесь в «сейчас»: что вы видите, слышите, чувствуете руками? Вы здесь, и это уже опора."
  moods: [anxious]
- id: en07
  text: "Попробуйте выдохнуть чуть дольше, чем вдохнули. Два-три раза — и становится немного тише."
  moods: [anxious]
- id: en08
  text: "Тревожные мысли — не прогноз, а просто мысли. Можно кивнуть им и вернуться к делу."
  moods: [anxious]
- id: en09
  text: "Не получилось? Значит, вы пробуете. Следующая попытка почти всегда мягче и умнее."
  moods: [stuck]
- id: en10
  text: "Когда ничего не выходит, помогает уменьшить задачу. Какой самый маленький шаг вы можете сделать сейчас?"
  moods: [stuck]
- id: en11
  text: "Ошибка — это не итог, а подсказка. Она показывает, где свернуть."
  moods: [stuck]
- id: en12
  text: "Иногда лучшее решение — отложить на ночь. Утро приносит свежие мысли."
  moods: [stuck]
- id: en13
  text: "Маленький шаг сегодня лучше, чем идеальный план «когда-нибудь»."
- id: en14
  text: "Начните с пяти минут. Часто самое трудное — просто начать."
- id: en15
  text: "Хорошее начинается с малого: с тёплого слова, с одного вечера, с одной сказки."
- id: en16
  text: "Вы справлялись и с более трудными днями. Справитесь и с этим."
- id: en17
  text: "Не сравнивайте свой обычный день с чужими красивыми кадрами. У каждого свой путь и свой темп."
- id: en18
  text: "Совершенство не нужно. Нужно, чтобы вы были рядом, и это уже получается."
- id: en19
  text: "Попросить о помощи — не слабость, а мудрое решение. Рядом могут быть люди, которые рады помочь."
- id: en20
  text: "Новый день — чистая страница. Что одно хорошее вы хотите на ней написать?"
  times: [morning]
- id: en21
  text: "Доброе утро! Пусть сегодня будет хотя бы один момент, ради которого захочется улыбнуться."
  times: [morning]
- id: en22
  text: "Выберите на сегодня одно дело, которое важно именно вам. Остальное приложится."
  times: [morning]
- id: en23
  text: "Сделайте паузу: выпейте воды, расправьте плечи. Дела никуда не убегут."
  times: [day]
- id: en24
  text: "Вы уже на середине дня. Всё, что сделано, засчитано."
  times: [day]
- id: en25
  text: "День позади, и вы дошли до его конца. Это уже победа."
  times: [evening]
- id: en26
  text: "Перед сном отпустите всё, что не успели. У завтрашнего дня будет свой шанс."
  times: [evening]
- id: en27
  text: "Пусть вечер будет мягким: приглушите свет, отложите телефон, послушайте тишину."
  times: [evening]
- id: en28
  text: "Запишите сегодняшний успех хоть в заметки: через месяц вы будете рады его перечитать."
  moods: [proud]
- id: en29
  text: "Хорошее хочется закрепить: расскажите о своей победе тому, кто порадуется вместе с вами."
  moods: [proud]
- id: en30
  text: "Любая привычка начинается с одного раза. Сегодня подходящий день для этого раза."
- id: en31
  text: "Замечайте хорошее: один тёплый момент в день уже меняет картину."
- id: en32
  text: "Можно чего-то пока не уметь. Для того чтобы научиться, у вас есть время."
- id: en33
  text: "Если задача кажется огромной, разделите её на три части. Начните с самой лёгкой."
  moods: [stuck]
- id: en34
  text: "Сегодня вы вправе закончить день раньше. Сон — тоже работа, и очень важная."
  moods: [tired]
  times: [evening]
- id: en35
  text: "Ночные мысли часто преувеличивают. Утром многое выглядит проще."
  moods: [anxious]
  times: [evening]
- id: en36
  text: "Радость можно планировать: что маленькое и приятное вы сделаете для себя на этой неделе?"
