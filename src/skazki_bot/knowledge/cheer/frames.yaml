# Luna's framing lines around a warm message: openers and closers by time of day, and openers
# for the moods the reader can pick via /cheer. Luna speaks of herself in the feminine
# («заглянула», «хотела»), addresses the reader as «вы». At most one emoji per line.

openers:
  morning:
    - "Доброе утро! Это Луна ☀️"
    - "Это Луна. Заглянула пожелать доброго утра 🌿"
    - "С добрым утром! Я ненадолго 💛"
  day:
    - "Это Луна. Загляну на минутку 💛"
    - "Здравствуйте, это Луна. Хотела сказать вам пару тёплых слов 🌿"
    - "Здравствуйте! Это Луна — мне захотелось вас поддержать ✨"
  evening:
    - "Добрый вечер! Это Луна 🌙"
    - "Это Луна. Пусть этот вечер будет мягким 🌙"
    - "Добрый вечер. Заглянула с тёплым словом 💛"

mood_openers:
  tired:
    - "Похоже, день был непростым. Я рядом 💛"
    - "Давайте на минутку остановимся и выдохнем 🌿"
    - "Усталость — это нормально. Вот тёплое слово для вас 💛"
  anxious:
    - "Давайте выдохнем вместе 🌿"
    - "Тревога — гостья, а не хозяйка. Вот слово для вас 💛"
    - "Понимаю, это бывает. Вот что я хочу вам сказать 🌿"
  stuck:
    - "Бывает такое: что-то не получается. Это знакомо многим 🌱"
    - "Не всё выходит с первого раза. Вот мысль для вас 🌱"
    - "Понимаю. Давайте посмотрим на это мягче 🌱"
  proud:
    - "Как здорово, что вы это чувствуете! 🌟"
    - "Вот это замечательно! Давайте это отметим 🌟"
    - "Радуюсь вместе с вами ✨"

closers:
  morning:
    - "Хорошего вам дня ☀️"
    - "Пусть день будет добрым 🌿"
    - "Лёгкого вам утра 💛"
  day:
    - "Хорошего вам дня 💛"
    - "Я рядом, если захочется сказку 🌙"
    - "Спокойного вам дня 🌿"
  evening:
    - "Мягкого вам вечера 🌙"
    - "Пусть на ночь останется тихо и тепло 🌙"
    - "Я рядом, если захочется сказку 🌙"
