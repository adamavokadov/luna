tales:
  - id: chukchi_chey_dom
    title: "Чей дом лучше?"
    origin: chukchi
    kind: animal
    collection: sn_mira_chukchi
    summary: "Суслик и медведь меняются жильём, потому что каждому своё кажется неудобным, и быстро понимают, что чужой дом им не впору."
    beats:
      - "Суслик и медведь встречаются у ручья и жалуются на жильё: у медведя тесная берлога, у суслика слишком просторная нора"
      - "Они решают поменяться и расходятся по новым домам"
      - "Суслику в огромной берлоге страшно: негде спрятаться ни от лисы, ни от ветра"
      - "Медведь не может втиснуться в крошечную норку, как ни пробует"
      - "Звери меряются размерами и вдруг ясно видят, кто из них мал, а кто велик"
      - "Они меняются обратно и больше никогда не жалуются на свои дома"
    moral: "Свой дом лучше всего подходит именно тебе; а жалобы проходят, когда посмотришь на чужую жизнь"
    themes: [animals, home, nature]
    motifs: [home_and_belonging, humility]
    min_age: 2
    max_age: 6
    scary: 0
    calm: true
    child_role: "Ребёнок встречает зверей у ручья и помогает каждому примерить чужой дом, чтобы они увидели: свой им дороже"

  - id: cossack_meshok_radosti
    title: "Мешок с радостью"
    origin: cossack
    kind: wonder
    collection: kazachi_businka
    summary: "Вернувшийся со службы казак находит станицу в слезах: Лихо собрала людскую радость в мешок. Казак хитростью запирает Лихо и возвращает радость людям."
    beats:
      - "Казак возвращается домой, а станица печальна, и даже родные поначалу его не узнают"
      - "На дороге он встречает старуху Лихо с мешком, где собрана радость всех жителей"
      - "Лихо жалобными речами пытается вытянуть и его радость, но казак не поддаётся"
      - "Казак замечает, что сила Лиха — в жалобах, и предлагает ей сыграть в прятки"
      - "Он хвалит Лихо за ловкость, уговаривает залезть в маленький кисет и крепко завязывает его"
      - "Казак развязывает мешок, радость разлетается по станице, и люди встречают его с объятиями"
    moral: "Уныние растёт, пока ему поддаёшься; бодрость и смекалка возвращают радость всем"
    themes: [home, adventure, magic]
    motifs: [cleverness_wins, community]
    min_age: 6
    max_age: 10
    scary: 2
    calm: false
    child_role: "Ребёнок встречает казака на дороге и помогает развязать мешок, чтобы радость вернулась в дома"
    ending_hint: "В оригинале Лихо потом попадает к жадному барину. Хватит того, что кисет заброшен далеко в крапиву и Лихо больше не вредит. Не пугай Лихом: она скорее смешная хитрюга, чем страшная"

  - id: cossack_volshebnaya_businka
    title: "Волшебная бусинка"
    origin: cossack
    kind: wonder
    collection: kazachi_businka
    summary: "Юноша выручает кота, собаку и ужа и получает от змеиного царя волшебную бусинку; когда жена её отнимает, верные кот и пёс возвращают бусинку."
    beats:
      - "Вместо хлеба юноша тратит последние копейки, чтобы спасти кота, собаку и ужа от обидчиков"
      - "Уж ведёт его к змеиному царю, и тот отдаёт в награду бусинку, исполняющую желания"
      - "С бусинкой у юноши появляются накрытый стол и новый дом, и он сватается к дочери атамана"
      - "Жена выведывает тайну, забирает бусинку и отправляет мужа с его друзьями на остров посреди реки"
      - "Кот и собака переправляются на берег, и кот просит мышей достать бусинку"
      - "Мышиный атаман щекочет хвостиком нос спящей, она чихает, и бусинка выкатывается"
      - "Бусинку роняют в реку, но кот находит её в рыбьем брюшке, и друзья возвращаются к хозяину"
    moral: "Добро возвращается: кто выручал слабых, получает помощь от них самих; а чужую тайну надо беречь"
    themes: [animals, magic, home, friendship]
    motifs: [kindness_rewarded, helper_animal, magic_gift, misuse_of_gift]
    min_age: 5
    max_age: 10
    scary: 1
    calm: false
    child_role: "Ребёнок — ещё один друг героя: он следит за бусинкой и подсказывает коту, где её искать"
    ending_hint: "Финал можно сделать мирным: жена понимает, что поступила нехорошо, и просит прощения, а все вместе живут в новом доме"

  - id: cossack_mysh_vorobey
    title: "Мышь и воробей"
    origin: cossack
    kind: animal
    collection: kazachi_businka
    summary: "Мышь и воробей вместе вырастили хлеб, но поссорились при дележе: мышь требует долю по числу лап, воробей хочет поровну."
    beats:
      - "После трёх голодных зим мышь и воробей решают вдвоём засеять поле"
      - "Мышь пашет землю, воробей носит зерно для посева, потом оба охраняют колосья"
      - "Осенью они убирают урожай и складывают зерно в одну кучу"
      - "Мышь предлагает делить по лапам: ей четыре меры, воробью две"
      - "Воробей спорит, что крылья тоже трудились, и звери с птицами вступают в ссору на стороне каждого"
      - "Когда ссора стихает, никто не получает пира, а мышь остаётся без запасов"
    moral: "Общий труд требует честной доли для каждого; упрямство и жадность разрушают дружбу"
    themes: [animals, farm, friendship, nature]
    motifs: [greed_punished, community, honesty]
    min_age: 4
    max_age: 8
    scary: 1
    calm: false
    child_role: "Ребёнок — миротворец: он предлагает делить урожай так, чтобы никому не было обидно"
    ending_hint: "Для малышей: мышь и воробей мирятся, делят зерно поровну и пекут пирог для всех соседей. Драку зверей и птиц смени на шумный спор"

  - id: kalmyk_mangas_bratya
    title: "Мангас и трое смелых братьев"
    origin: kalmyk
    kind: wonder
    collection: kalmyk_mangas
    summary: "Чудище-мангас уносит сестру; трое братьев, каждый со своим даром — зоркостью, меткостью и ловкостью рук, — вместе её спасают и потом спорят, чья заслуга больше."
    beats:
      - "Пока братья на охоте, мангас уносит сестру, и мать горюет"
      - "Братья рассказывают, что кто умеет: старший всё разглядит, средний метко стреляет, младший ловит всё, что падает"
      - "Старший находит в небе облако, на котором сидит мангас с девушкой"
      - "Средний метким выстрелом поражает чудовище, не задев сестру"
      - "Младший ловит падающую сестру, и она остаётся целой"
      - "На пиру знатоки спорят, кому отдать коня, и понимают, что без каждого из братьев дело не вышло бы"
    moral: "Победа общая: у каждого свой дар, и он работает только вместе с дарами других"
    themes: [adventure, magic, home, friendship]
    motifs: [community, courage, cleverness_wins]
    min_age: 6
    max_age: 10
    scary: 2
    calm: false
    child_role: "Ребёнок — четвёртый в отряде: у него свой дар (например, замечать мелочи), и без него спасение не получилось бы"
    ending_hint: "Мангас не гибнет: он улетает за край степи, испугавшись метких стрел. Описывай его скорее как большое мохнатое облако-чудище, чем как злодея"

  - id: kalmyk_enkira_korova
    title: "Девочка и белая корова"
    origin: kalmyk
    kind: wonder
    collection: kalmyk_mangas
    summary: "Белая корова кормит падчерицу молоком; когда злая мачеха губит корову, добрая сила превращается в юрту, верблюжонка, тополь и щепку, пока не раскрывается правда."
    beats:
      - "Падчерица пасёт коров и ходит в старой одежде, а родную дочь мачеха балует"
      - "Белая корова поит девочку молоком, и та расцветает"
      - "Ленивая дочь мачехи не получает молока, и мачеха приказывает зарезать корову"
      - "Корова просит спрятать рога и унести в степь: из них вырастает белая юрта с угощением"
      - "Сын хана сватается к падчерице, но мачеха подсылает свою дочь"
      - "Падчерица оборачивается верблюжонком, тополем и щепкой, а потом становится приёмной дочерью пастуха"
      - "Хан слышит её историю, узнаёт настоящую невесту, и правда выходит наружу"
    moral: "Доброта не пропадает бесследно, а обман рано или поздно раскрывается"
    themes: [animals, farm, magic, home]
    motifs: [kindness_rewarded, transformation, helper_animal]
    min_age: 6
    max_age: 10
    scary: 2
    calm: false
    child_role: "Ребёнок — друг девочки на пастбище: он приносит ей воду и не оставляет в печали"
    ending_hint: "Смягчи жестокие места: корова не гибнет, а уходит в степь и сама становится юртой; озеро — просто высохший пруд, где девочка превращается в верблюжонка. Мачеха в конце извиняется"

  - id: chinese_volshebnaya_kist
    title: "Волшебная кисть"
    origin: chinese
    kind: wonder
    collection: kitay_mudrye
    summary: "Мальчик-сирота мечтает рисовать, получает волшебную кисть и оживляет нарисованное, но отказывается служить жадным людям."
    beats:
      - "Сирота без кисти и красок рисует прутиком на земле и углём на стене пещеры"
      - "Старец во сне дарит золотую кисть: всё нарисованное оживает, но кисть нужна только для добра"
      - "Мальчик рисует односельчанам утварь, орудия и скот, и все живут в достатке"
      - "Богач запирает художника в сарае, но тот рисует лестницу и уходит"
      - "В столице император требует горы золота, но у него получаются одни камни"
      - "Художник рисует море, корабль и бурю, и жадный правитель больше не мешает людям"
    moral: "Дар, полученный за верность мечте, надо тратить на добро, а не на чужую жадность"
    themes: [art, magic, kingdom]
    motifs: [magic_gift, greed_punished, kindness_rewarded, perseverance]
    min_age: 5
    max_age: 10
    scary: 1
    calm: false
    child_role: "Ребёнок — друг художника: он подсказывает, что ещё нарисовать для деревни, и хранит секрет кисти"
    ending_hint: "Император не тонет: нарисованный корабль уносит его далеко от берега, и он больше не возвращается. Не описывай крушение подробно"

  - id: chinese_volshebnyy_sosud
    title: "Волшебный котёл"
    origin: chinese
    kind: wonder
    collection: kitay_mudrye
    summary: "Младший сын плотника отдаёт свои деньги чужой беде, получает от повелителя драконов волшебный котёл на год и делится им, но жадные братья пытаются его отнять."
    beats:
      - "Отец отправляет троих сыновей учиться ремёслам на три года; младший выбирает плотницкое дело"
      - "По дороге домой младший отдаёт все деньги плачущей девушке, у которой пал вол, и возвращается с пустым кошельком"
      - "Братья корят его, а сестра даёт заколку и советует идти искать удачу"
      - "В заброшенной хижине юноша хитростью справляется со змеем и забирает его жемчужину"
      - "Выясняется, что змей — повелитель драконов, но тот прощает юношу, не знавшего вины, и дарит ему на год котёл, исполняющий желания"
      - "Сестра получает от брата свадебный подарок, а братья сговариваются отнять котёл"
      - "Младший строит дом, но братья остаются в зарослях полыни ни с чем, и он вовремя возвращает котёл"
    moral: "Любовь и дружбу не купить сокровищами, а добрый поступок возвращается наградой"
    themes: [magic, home, dragons]
    motifs: [kindness_rewarded, greed_punished, magic_gift]
    min_age: 6
    max_age: 10
    scary: 2
    calm: false
    child_role: "Ребёнок — друг юноши в дороге: он замечает, что девушка плачет, и первым предлагает помочь"
    ending_hint: "Змея не убивают: юноша хитростью запирает его в сундуке, пока тот не вернёт жемчужину, а повелитель драконов в обличье змея просто испытывал путника. Братьев не наказывай: они исчезают из дома, поняв свою жадность"

  - id: chinese_belyy_drakon
    title: "Белый дракон"
    origin: chinese
    kind: legend
    collection: kitay_mudrye
    summary: "Раз в три года Чёрный дракон поднимает бурю, и народ прячется в горах; плотник вырезает деревянного Белого дракона, а потом вся деревня вместе побеждает чудище."
    beats:
      - "Раз в три года Чёрный дракон просыпается в омуте и поднимает бурю с наводнением"
      - "Люди каждый раз уходят в горы и пережидают беду"
      - "Плотник решает вырезать из дерева огромного дракона, который сразится с чёрным"
      - "Деревня оживляет Белого дракона и опускает в омут, но Чёрный в первый раз сильнее"
      - "Дети учатся резьбе и вырезают маленьких драконов в помощь большому"
      - "Белый дракон и маленькие помощники побеждают Чёрного и засыпают в омуте до новой беды"
      - "Каждый год люди бросают в воду цветы и факелы в память о том, как справились вместе"
    moral: "Вместе мы побеждаем то, чего не одолеть в одиночку, и каждая помощь — даже самая маленькая — нужна"
    themes: [dragons, nature, adventure]
    motifs: [community, perseverance, courage, origin_story]
    min_age: 6
    max_age: 10
    scary: 2
    calm: false
    child_role: "Ребёнок вырезает самого маленького дракона и по-своему помогает общей победе"
    ending_hint: "Не делай акцент на потере: сын плотника в конце возвращается живым. Бой драконов опиши как грозовое небо с вспышками, без жестокости"

  - id: chinese_zolotye_krupinki
    title: "Золотые крупинки"
    origin: chinese
    kind: wonder
    collection: kitay_mudrye
    summary: "Младший брат разговорился с усталым камнем и получил золотые крупинки, а жадный старший хотел больше и остался ни с чем."
    beats:
      - "Старший брат делает младшего работником, тот трудится с рассвета до темноты, потом уходит из дома с топором и верёвкой"
      - "Каждый день он кладёт вязанку хвороста на большой камень отдохнуть"
      - "Камень ворчит, что устал, и юноша жалуется ему на свою долю"
      - "Камень открывает рот и отсыпает горсть золотых крупинок, а юноша обещает больше не загружать его"
      - "На эти деньги младший брат покупает вола и повозку, и дела идут в гору"
      - "Старший брат узнаёт тайну, приходит к камню, жадно тянет золото обеими руками и остаётся ни с чем"
    moral: "Тому, кто бережёт других, помогают; жадность оставляет ни с чем"
    themes: [nature, home, magic]
    motifs: [kindness_rewarded, greed_punished]
    min_age: 4
    max_age: 9
    scary: 0
    calm: true
    child_role: "Ребёнок встречает младшего брата в лесу и помогает ему поставить вязанку так, чтобы камню было легче"
    ending_hint: "Старший брат не застревает: камень просто закрывает рот, и он уходит ни с чем, пристыженный"

  - id: chinese_tri_dereva
    title: "Три дерева"
    origin: chinese
