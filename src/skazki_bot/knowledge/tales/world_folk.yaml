# Народные сюжеты разных стран как основа для сказок Луны (часть базы знаний о сказках: docs/FOLK_SOURCES.md).
#
# Это авторские конспекты, а не тексты: сюжеты народные, формулировки наши. Ничего не цитируем и не
# пересказываем близко к тексту сборников: «ключевые события» (beats) — это самые мелкие смысловые
# звенья сюжета, по одному событию в строке, из которых бот собирает сказку заново под ребёнка.
#
# Верхний уровень файла: collections (откуда взят сюжет) и tales (сами сюжеты).
# Поля сюжета: id, title, origin, kind, collection, summary, beats (4-9), moral, themes, motifs,
#   min_age, max_age, scary (0..3), calm (подходит для сказки на ночь), child_role, ending_hint
#   (обязателен при scary >= 2: как смягчить жестокие места оригинала).
# Темы: те же, что в classics.yaml (animals forest farm adventure magic fairies kingdom sea winter
#   home food friendship nature insects music + dragons space art ...).
# Мотивы: kindness_rewarded greed_punished cleverness_wins magic_gift helper_animal transformation
#   trial_of_wit origin_story community home_and_belonging honesty humility perseverance courage
#   caution foolishness three_wishes misuse_of_gift

collections:
