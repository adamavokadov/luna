    - "Лиса просится к зайцу погреться и выгоняет хозяина"
    - "Заяц плачет; собака, медведь и бык пытаются помочь, но лиса их пугает"
    - "Петух с косой на плече смело идёт к избушке и прогоняет лису"
  moral: "Храбрость и доброта сильнее хитрости; настоящий друг не бросит в беде"
