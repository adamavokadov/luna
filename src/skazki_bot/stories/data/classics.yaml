  max_age: 7
  scary: 2
  child_role: "Ребёнок помогает поросятам строить каменный дом"
  ending_hint: "Волк не попадает в котёл: он убегает, а поросята учат его строить, вместо того чтобы дуть"

- id: bremenskie_muzykanty
  title: Бременские музыканты
