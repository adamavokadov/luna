# Библиотека классических сюжетов.
# Это авторские конспекты (не тексты!) по народным сказкам и произведениям, вышедшим из-под
# охраны авторских прав. Бот пересказывает их заново под конкретного ребёнка.
#
# Поля: id, title, summary, beats (ключевые события), moral, themes, min_age, max_age,
#       scary (0..3 — «страшность» сюжета), child_role (как вплести ребёнка), ending_hint (необязательно).
# Темы: animals forest farm adventure magic fairies kingdom sea winter home food friendship nature insects music

- id: kolobok
  title: Колобок
  summary: "Румяный Колобок убегает от бабушки с дедушкой и встречает в лесу зверей, которые хотят его съесть."
  beats:
    - "Бабушка печёт Колобка и ставит остывать на окошко"
    - "Колобок спрыгивает и катится по дорожке, напевая весёлую песенку"
    - "Он ловко ускользает от зайца, волка и медведя, каждый раз допевая песенку"
    - "Хитрая лиса хвалит его песенку и просит спеть поближе"
  moral: "Не доверяй льстивым словам и не уходи далеко от дома без спроса"
  themes: [animals, forest, adventure, home]
  min_age: 2
  max_age: 7
  scary: 1
  child_role: "Ребёнок встречает Колобка на лесной тропинке и помогает ему не попасться лисе и вернуться домой"
  ending_hint: "В оригинале лиса съедает Колобка. Сделай финал добрым: Колобка выручает ребёнок, он возвращается домой, а лиса получает пирожки и перестаёт хитрить"

- id: repka
  title: Репка
  summary: "Дед посадил репку, она выросла огромной, и вытянуть её удалось только всем вместе."
  beats:
    - "Дед сажает репку и ухаживает за ней"
    - "Репка вырастает большая-пребольшая, дед не может её вытянуть"
    - "Один за другим на помощь зовут бабку, внучку, Жучку, кошку и мышку"
    - "Вместе тянут-потянут — и вытягивают репку"
  moral: "Вместе мы сильнее; помощь даже самого маленького важна"
  themes: [farm, home, friendship]
  min_age: 2
  max_age: 5
  scary: 0
  child_role: "Ребёнок — помощник, который догадывается позвать следующего на помощь"

- id: teremok
  title: Теремок
  summary: "В поле стоит маленький теремок, и в нём селятся все новые лесные жители."
  beats:
    - "В поле стоит пустой теремок, его находит мышка-норушка"
    - "К теремку по очереди приходят лягушка-квакушка, зайчик-побегайчик и лисичка-сестричка"
    - "Каждый просится пожить, и все договариваются жить дружно"
    - "Приходит большой неуклюжий медведь, и в теремке уже тесно"
  moral: "Для друзей всегда найдётся место, а если тесно — можно построить вместе новое"
  themes: [animals, forest, friendship, home]
  min_age: 2
  max_age: 6
  scary: 1
  child_role: "Ребёнок — строитель, который придумывает, как всем поместиться"
  ending_hint: "В оригинале медведь ломает теремок. Пусть теремок не ломается: все вместе (и ребёнок) пристраивают к нему новую комнату для медведя"

- id: ryaba
  title: Курочка Ряба
  summary: "Курочка снесла золотое яичко, которое дед и баба никак не могли разбить, а мышка разбила нечаянно."
  beats:
    - "Жили дед да баба, и была у них курочка Ряба"
    - "Курочка снесла яичко — не простое, золотое"
    - "Дед бил-бил — не разбил, баба била-била — не разбила"
    - "Мышка бежала, хвостиком махнула — яичко упало и разбилось, дед и баба заплакали"
    - "Курочка утешает их и обещает снести другое, простое"
  moral: "Не стоит горевать из-за потерянного — рядом всегда есть то, что радует"
  themes: [farm, animals, home]
  min_age: 2
  max_age: 4
  scary: 0
  child_role: "Ребёнок утешает деда и бабу и придумывает, что вкусное приготовить из простого яичка"

- id: masha_medved
  title: Маша и медведь
  summary: "Девочка заблудилась в лесу, попала в избушку к медведю и хитростью вернулась домой."
  beats:
    - "Маша с подружками идёт в лес и отстаёт от них, заблудившись"
    - "Она находит избушку, где живёт медведь, и остаётся помогать по хозяйству"
    - "Маша печёт пирожки и придумывает хитрый план возвращения домой"
    - "Она прячется в большом коробе, а медведь несёт «гостинцы» в деревню"
    - "Маша возвращается домой к бабушке и дедушке"
  moral: "Смекалка и спокойствие помогают в трудную минуту; без спроса далеко не уходи"
  themes: [forest, animals, adventure, home, food]
  min_age: 4
  max_age: 8
  scary: 2
  child_role: "Ребёнок — друг Маши, который вместе с ней придумывает хитрость"
  ending_hint: "Пусть медведь окажется неуклюжим и одиноким, а не злым; в конце они мирятся"

- id: tri_medvedya
  title: Три медведя
  summary: "Девочка забрела в лесной домик, где жили три медведя, и перепробовала их стулья, миски и кровати."
  beats:
    - "Девочка заблудилась в лесу и нашла аккуратный домик, в котором никого нет"
    - "Она пробует три стула, три миски с кашей и три кровати — выбирает те, что в самый раз"
    - "Возвращаются хозяева: большой медведь, медведица и маленький медвежонок"
    - "Медведи видят, что кто-то похозяйничал, находят девочку, и она выбегает из дома"
  moral: "Нельзя брать чужое без спроса; извиняться — это смело"
  themes: [forest, animals, home, food]
  min_age: 3
  max_age: 7
  scary: 1
  child_role: "Ребёнок — та самая девочка (или мальчик) или её друг, который просит у медведей прощения"
  ending_hint: "Медведи не сердятся: после извинения они вместе пьют чай с вареньем"

- id: zayushkina_izbushka
  title: Заюшкина избушка
  summary: "Лиса выгнала зайца из его избушки, и зайцу помогает прогнать её храбрый петух."
  beats:
    - "У лисы избушка ледяная, а у зайца — лубяная; весной лисья растаяла"
    - "Лиса просится к зайцу погреться и выгоняет хозяина"
    - "Заяц плачет; собака, медведь и бык пытаются помочь, но лиса их пугает"
    - "Петух с косой на плече смело идёт к избушке и прогоняет лису"
  moral: "Храбрость и доброта сильнее хитрости; настоящий друг не бросит в беде"
  themes: [animals, forest, friendship, winter]
  min_age: 3
  max_age: 6
  scary: 1
  child_role: "Ребёнок утешает зайчика и идёт с ним за помощью"
  ending_hint: "Лиса не злая навсегда: она извиняется и ей помогают построить новый тёплый домик"

- id: gusi_lebedi
  title: Гуси-лебеди
  summary: "Гуси-лебеди унесли братца, и сестрица Маша отправилась его искать через лес, поле и реку."
  beats:
    - "Маша на минутку уходит из дома, а гуси-лебеди уносят её братишку"
    - "Девочка бежит за ними и спрашивает дорогу у печки, яблони и молочной реки"
    - "Те просят о маленькой услуге, и Маша вежливо помогает каждому"
    - "В избушке Бабы Яги Маша находит братца и бежит обратно"
    - "Печка, яблоня и река прячут беглецов от погони"
  moral: "Забота о близких и вежливость помогают пройти любой путь"
  themes: [magic, adventure, forest, home, friendship]
  min_age: 5
  max_age: 10
  scary: 3
  child_role: "Ребёнок — верный помощник Маши в поисках братца"
  ending_hint: "Баба Яга — строгая, но справедливая; гуси-лебеди оказываются озорными, а не злыми"

- id: morozko
  title: Морозко
  summary: "Добрая падчерица в зимнем лесу встретила Морозко и вежливым ответом заслужила подарки."
  beats:
    - "Злая мачеха отправляет падчерицу в лес в сильный мороз"
    - "Морозко спрашивает девочку: «Тепло ли тебе?» — она отвечает ему ласково и вежливо"
    - "Морозко одаривает её тёплой шубой, сундуком подарков и добротой"
    - "Родная дочка мачехи грубит Морозко и остаётся без подарков"
  moral: "Доброе слово и вежливость возвращаются добром"
  themes: [winter, forest, magic, home]
  min_age: 5
  max_age: 10
  scary: 2
  child_role: "Ребёнок встречает Морозко вместе с героиней и помогает ей не растеряться"
  ending_hint: "Никто не замерзает насмерть: Морозко лишь сердится на грубость, а потом даёт шанс исправиться"

- id: tsarevna_lyagushka
  title: Царевна-лягушка
  summary: "Стрела Ивана-царевича упала в болото, и невестой ему стала мудрая лягушка."
  beats:
    - "Иван-царевич пускает стрелу, которая падает в болото к лягушке"
    - "Царь задаёт невесткам задания — испечь хлеб и соткать ковёр"
    - "Лягушка превращается в Василису Премудрую и справляется с заданиями за ночь"
    - "На пиру все удивляются её мастерству; Иван учится ценить Василису"
  moral: "Не суди о людях по внешности — ум и доброта важнее"
  themes: [magic, kingdom, adventure]
  min_age: 6
  max_age: 10
  scary: 2
  child_role: "Ребёнок — друг царевича, который замечает, что лягушка необыкновенная"

- id: zolotaya_rybka
  title: Золотая рыбка
  summary: "Старик отпустил золотую рыбку, а старуха всё просила и просила у неё новые подарки."
  beats:
    - "Старик ловит невод и вытаскивает золотую рыбку, которая просит отпустить её на волю"
    - "Он отпускает рыбку без награды, старуха ругает его и посылает просить корыто"
    - "Рыбка исполняет просьбы: новое корыто, избу, потом ещё и ещё"
    - "Старуха хочет стать владычицей морской, и рыбка уплывает"
  moral: "Жадность не приводит к счастью; умей быть благодарным за то, что есть"
  themes: [sea, magic, home]
  min_age: 5
  max_age: 10
  scary: 1
  child_role: "Ребёнок — внук или внучка, которые ловят рыбку вместе со стариком"
  ending_hint: "Финал мягкий: рыбка прощает, а бабушка учится радоваться простому"

- id: lisa_zhuravl
  title: Лиса и журавль
  summary: "Лиса и журавль угощали друг друга так, что гость остался голодным, — пока не научились заботиться друг о друге."
  beats:
    - "Лиса приглашает журавля и подаёт кашу на плоской тарелке — журавль не может её поесть"
    - "Журавль приглашает лису в ответ и подаёт окрошку в кувшине с узким горлышком"
    - "Теперь лиса голодна, и она понимает, как было обидно журавлю"
  moral: "Поступай с другими так, как хочешь, чтобы поступали с тобой"
  themes: [animals, food, friendship, forest]
  min_age: 3
  max_age: 7
  scary: 0
  child_role: "Ребёнок — помощник, который придумывает, как накормить обоих гостей"
  ending_hint: "Лиса и журавль мирятся и придумывают посуду, удобную обоим"

- id: volk_kozlyata
  title: Волк и семеро козлят
  summary: "Мама-коза просит козлят никому не открывать, но хитрый волк подделывает голос."
  beats:
    - "Коза уходит за травкой и наказывает козлятам не открывать дверь чужим"
    - "Волк подкрадывается и поёт грубым голосом — козлята его узнают и не открывают"
    - "Волк идёт к кузнецу, чтобы выковать тонкий голос, и приходит снова"
    - "Козлята прячутся кто куда, а мама-коза возвращается и всё понимает"
  moral: "Слушайся родителей и не открывай дверь незнакомцам"
  themes: [animals, home, forest]
  min_age: 3
  max_age: 6
  scary: 2
  child_role: "Ребёнок — восьмой козлёнок, который подсказывает, где спрятаться"
  ending_hint: "Волк никого не глотает: козлята ловко прячутся, а коза мудро и без драки прогоняет волка"

- id: gadkiy_utenok
  title: Гадкий утёнок
  summary: "Непохожего на других утёнка обижают, но весной он превращается в прекрасного лебедя."
  beats:
    - "На птичьем дворе вылупляется утёнок, который не похож на остальных"
    - "Другие птицы смеются над ним, и утёнок уходит искать своё место"
    - "Он переживает осень и холодную зиму, находит добрых друзей"
    - "Весной утёнок видит своё отражение и понимает, что он — лебедь"
  moral: "Каждый хорош по-своему, и у каждого своё время расцвести"
  themes: [animals, nature, friendship, winter]
  min_age: 4
  max_age: 10
  scary: 1
  child_role: "Ребёнок — друг утёнка, который поддерживает его в трудный путь"
  ending_hint: "Смягчи сцены обид; сделай акцент на дружбе и на том, что утёнка принимают таким, какой он есть"

- id: dyuymovochka
  title: Дюймовочка
  summary: "Крошечная девочка из цветка отправляется в путешествие и находит друзей среди ласточек и эльфов."
