    - "Девочка попадает к жабе, жуку и полевой мыши, но нигде не находит настоящего дома"
    - "Дюймовочка выхаживает озябшую ласточку, и та помнит добро"
    - "Ласточка уносит Дюймовочку в тёплые края, к народу цветочных эльфов"
  moral: "Добро возвращается, и настоящий дом там, где тебя понимают"
