  moral: "Тот, кто трудится, заслуживает награды; дело любит дружную работу"
  themes: [farm, animals, friendship, food]
  min_age: 3
  max_age: 6
  scary: 0
  child_role: "Ребёнок — помощник, который зовёт мышат работать вместе"
  ending_hint: "Мышата признают ошибку, и все вместе печёт ещё один пирог — получается праздник"
