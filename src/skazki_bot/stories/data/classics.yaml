  max_age: 10
  scary: 1
  child_role: "Ребёнок уменьшается до размера Дюймовочки и путешествует вместе с ней"
  ending_hint: "Жаба, жук и крот не злодеи, а просто не понимают Дюймовочку"

- id: tri_porosenka
  title: Три поросёнка
